# METABEGIN
# X-Env-Layer-Name: pt-secureboot
# X-Env-Layer-Category: security
# X-Env-Layer-Desc: Team Singularity ML-DSA-65 verified boot. Installs the
#  post-quantum manifest verifier and the device public key.
# X-Env-Layer-Version: 0.1.0
# METAEND
---
mmdebstrap:
  setup-hooks:
    - echo "pt-secureboot layer active"
  customize-hooks:
    - mkdir -p "$1/usr/local/bin" "$1/etc/pi-trust"
    - cp pt-verify "$1/usr/local/bin/pt-verify"
    - chmod 755 "$1/usr/local/bin/pt-verify"
    - cp dev.pk "$1/etc/pi-trust/device.pk"
    - chmod 644 "$1/etc/pi-trust/device.pk"
    - echo "pt-secureboot verifier installed"
  packages:
    - cryptsetup-bin
